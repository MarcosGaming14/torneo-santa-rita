<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#080B11"/>
<title>Campeonato Santa Rita 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080B11;--surface:#10151E;--surface-2:#19202C;--surface-3:#232C3B;
--border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
--text:#F4F6FA;--text-2:#8E99AB;--text-3:#5A6577;
--primary:#00E676;--primary-soft:rgba(0,230,118,.12);
--gold:#FFC93C;--silver:#C9D1DC;--bronze:#E08B4B;--danger:#FF4D5E;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;background:#04060A;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center}
.app{width:100%;max-width:520px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:640px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.topbar{padding:calc(var(--safe-top) + 16px) 18px 14px;background:linear-gradient(180deg,#0B1018 0%,#080B11 100%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--primary) 0%,#00B85E 100%);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(0,230,118,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.brand-text{min-width:0;flex:1}
.brand-title{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--primary);background:var(--primary-soft);padding:4px 9px;border-radius:100px;text-transform:uppercase;flex-shrink:0}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.cat-tabs{display:flex;gap:6px;padding:14px 18px 0;overflow-x:auto;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 15px;border-radius:100px;font-size:13px;font-weight:700;color:var(--text-2);background:var(--surface-2);border:1px solid transparent;white-space:nowrap;transition:all .18s;cursor:pointer;font:inherit}
.cat-tab.active{background:var(--primary);color:#04140A;border-color:var(--primary);box-shadow:0 4px 14px rgba(0,230,118,.28)}
.content{padding:20px 18px calc(40px + var(--safe-bottom))}
.section-title{font-size:11px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin:24px 4px 10px}
.section-title:first-child{margin-top:0}
.standings-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.standings-scroll::-webkit-scrollbar{display:none}
.standings-table{display:inline-block;min-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.s-row{display:grid;grid-template-columns:34px 128px 34px 34px 34px 34px 34px 34px 40px 42px;align-items:center;font-size:13px;border-bottom:1px solid var(--border);background:var(--surface)}
.s-row:last-child{border-bottom:none}
.s-head{background:var(--surface-2);color:var(--text-3);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;height:34px}
.s-row>div{padding:8px 0;text-align:center}
.s-pos{position:sticky;left:0;background:inherit;z-index:2;font-weight:800;color:var(--text-2);display:grid;place-items:center;font-size:12px}
.s-head .s-pos{background:var(--surface-2)}
.s-team{position:sticky;left:34px;background:inherit;z-index:2;display:flex;align-items:center;gap:8px;padding-left:2px!important;padding-right:8px!important;text-align:left!important;min-width:0;box-shadow:10px 0 14px -12px rgba(0,0,0,.6)}
.s-head .s-team{background:var(--surface-2);box-shadow:none}
.s-team-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.s-num{font-variant-numeric:tabular-nums;color:var(--text-2);font-weight:600;font-size:12.5px}
.s-pts{color:var(--text);font-weight:800;font-size:14px}
.s-row.is-qualified .s-pos{color:var(--primary)}
.s-row.is-eliminated{opacity:.55}
.s-row.is-eliminated .s-pos{color:var(--danger)}
.s-row.has-medal .s-pos{font-size:15px}
.badge{display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--c) 20%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);font-weight:800;flex-shrink:0;font-size:.72em;letter-spacing:.02em;line-height:1}
.badge-square{border-radius:9px}
.match{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.match-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
.match-time{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em}
.match-time::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--primary)}
.match.is-done .match-time::before{background:var(--text-3)}
.match-date{font-size:10px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em}
.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.right{flex-direction:row-reverse;text-align:right}
.side-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.side.right .side-name{text-align:right}
.score{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.score .num{min-width:26px;text-align:center;padding:3px 6px;border-radius:8px;background:var(--surface-2)}
.score .dash{color:var(--text-3);font-weight:600}
.match.is-done .score .winner{color:var(--primary)}
.vs-pill{font-size:11px;font-weight:800;color:var(--text-3);padding:4px 8px;border-radius:6px;background:var(--surface-2);letter-spacing:.1em}
.scorers-line{font-size:11px;color:var(--text-2);font-weight:600;padding-top:8px;border-top:1px dashed var(--border-2);line-height:1.5}
.scorers-line b{color:var(--text);font-weight:800;margin-right:4px}
.empty{text-align:center;padding:32px 20px;color:var(--text-3);font-size:13.5px;font-weight:600}
.footer{text-align:center;padding:28px 0 8px;font-size:11px;color:var(--text-3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.footer b{color:var(--primary)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">⚽</div>
      <div class="brand-text">
        <div class="brand-title" id="t-name">Cargando…</div>
        <div class="brand-sub" id="t-sub">Temporada 2026</div>
      </div>
      <div class="live-pill">Oficial</div>
    </div>
    <div class="cat-tabs" id="cats"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   DATOS EMBEBIDOS — sincronizados con index.html
============================================================ */
const CATEGORIES=[
{id:'cat_11_14',label:'11–14',pill:'11–14'},
{id:'cat_15_17',label:'15–17',pill:'15–17'},
{id:'cat_fem',label:'Femenina Abierta',pill:'Femenina'}];

const TEAMS={
cat_11_14:[
{id:'c1114_furias',name:'Furias FC',city:'Santa Rita',color:'#EF4444'},
{id:'c1114_alcones',name:'Los Alcones',city:'Santa Rita',color:'#DC2626'},
{id:'c1114_depflores',name:'Deportivo Las Flores',city:'Las Flores',color:'#DC2626'},
{id:'c1114_guerreritos',name:'Los Guerreritos',city:'Campana',color:'#1E3A8A'},
{id:'c1114_cuervos',name:'Los Cuervos',city:'Mingueo',color:'#F59E0B'}],
cat_15_17:[
{id:'c1517_galacticos',name:'Los Galácticos',city:'Santa Rita',color:'#1E3A8A'},
{id:'c1517_depflores',name:'Deportivo Las Flores',city:'Las Flores',color:'#DC2626'},
{id:'c1517_guerreros',name:'Los Guerreros',city:'Campana',color:'#1E3A8A'},
{id:'c1517_espartanos',name:'Espartanos FC',city:'Mingueo',color:'#991B1B'}],
cat_fem:[
{id:'fem_fenix',name:'Fénix',city:'Santa Rita',color:'#F97316'},
{id:'fem_depflores',name:'Deportivo Las Flores',city:'Las Flores',color:'#DC2626'},
{id:'fem_guerreras',name:'Las Guerreras',city:'Campana',color:'#1E3A8A'},
{id:'fem_dibulla',name:'Dibulla Renaciente',city:'Dibulla',color:'#06B6D4'},
{id:'fem_alfas',name:'Las Alfas FC',city:'Mingueo',color:'#EC4899'},
{id:'fem_sueno',name:'Sueño de Campeonas',city:'Mingueo',color:'#7C3AED'},
{id:'fem_sierrita',name:'La Sierrita',city:'Mingueo',color:'#14B8A6'}]};

const D={
  sep12:{label:'Sáb 12 sep',key:'2026-09-12'},
  sep13:{label:'Dom 13 sep',key:'2026-09-13'},
  sep19:{label:'Sáb 19 sep',key:'2026-09-19'},
  sep20:{label:'Dom 20 sep',key:'2026-09-20'},
  sep26:{label:'Sáb 26 sep',key:'2026-09-26'},
  sep27:{label:'Dom 27 sep',key:'2026-09-27'},
  oct03:{label:'Sáb 3 oct',key:'2026-10-03'},
  oct04:{label:'Dom 4 oct',key:'2026-10-04'},
  oct11:{label:'Sáb 11 oct',key:'2026-10-11'}
};

let _ord=0;
function M(id,cat,day,time,timeLabel,home,away){return{id,categoryId:cat,dateKey:day.key,dayLabel:day.label,time,timeLabel,homeId:home,awayId:away,order:_ord++};}

const MATCHES=[
/* SÁBADO 12 SEP */
M('m01','cat_11_14',D.sep12,'08:30','8:30 AM','c1114_furias','c1114_alcones'),
M('m02','cat_fem',D.sep12,'09:25','9:25 AM','fem_fenix','fem_guerreras'),
M('m03','cat_15_17',D.sep12,'10:20','10:20 AM','c1517_galacticos','c1517_guerreros'),
M('m04','cat_11_14',D.sep12,'15:00','3:00 PM','c1114_alcones','c1114_cuervos'),
M('m05','cat_fem',D.sep12,'15:55','3:55 PM','fem_sueno','fem_alfas'),
M('m06','cat_15_17',D.sep12,'16:50','4:50 PM','c1517_galacticos','c1517_espartanos'),

/* DOMINGO 13 SEP */
M('m07','cat_11_14',D.sep13,'15:00','3:00 PM','c1114_depflores','c1114_alcones'),
M('m08','cat_15_17',D.sep13,'15:55','3:55 PM','c1517_depflores','c1517_galacticos'),
M('m09','cat_fem',D.sep13,'16:50','4:50 PM','fem_depflores','fem_fenix'),

/* SÁBADO 19 SEP */
M('m10','cat_11_14',D.sep19,'08:30','8:30 AM','c1114_furias','c1114_cuervos'),
M('m11','cat_fem',D.sep19,'09:25','9:25 AM','fem_fenix','fem_dibulla'),
M('m12','cat_fem',D.sep19,'10:20','10:20 AM','fem_sueno','fem_sierrita'),
M('m13','cat_11_14',D.sep19,'15:00','3:00 PM','c1114_depflores','c1114_cuervos'),
M('m14','cat_fem',D.sep19,'15:55','3:55 PM','fem_depflores','fem_alfas'),
M('m15','cat_fem',D.sep19,'16:50','4:50 PM','fem_sierrita','fem_guerreras'),

/* DOMINGO 20 SEP */
M('m16','cat_11_14',D.sep20,'15:00','3:00 PM','c1114_furias','c1114_guerreritos'),
M('m17','cat_15_17',D.sep20,'15:55','3:55 PM','c1517_depflores','c1517_espartanos'),
M('m18','cat_fem',D.sep20,'16:50','4:50 PM','fem_fenix','fem_sueno'),

/* SÁBADO 26 SEP */
M('m19','cat_fem',D.sep26,'08:30','8:30 AM','fem_fenix','fem_alfas'),
M('m20','cat_11_14',D.sep26,'09:25','9:25 AM','c1114_depflores','c1114_guerreritos'),
M('m21','cat_fem',D.sep26,'10:20','10:20 AM','fem_depflores','fem_sueno'),
M('m22','cat_11_14',D.sep26,'15:00','3:00 PM','c1114_cuervos','c1114_guerreritos'),
M('m23','cat_fem',D.sep26,'15:55','3:55 PM','fem_guerreras','fem_alfas'),
M('m24','cat_15_17',D.sep26,'16:50','4:50 PM','c1517_guerreros','c1517_espartanos'),

/* DOMINGO 27 SEP */
M('m25','cat_fem',D.sep27,'15:00','3:00 PM','fem_dibulla','fem_sueno'),
M('m26','cat_11_14',D.sep27,'15:55','3:55 PM','c1114_furias','c1114_depflores'),
M('m27','cat_fem',D.sep27,'16:50','4:50 PM','fem_guerreras','fem_dibulla'),

/* SÁBADO 3 OCT */
M('m28','cat_fem',D.oct03,'08:30','8:30 AM','fem_fenix','fem_sierrita'),
M('m29','cat_fem',D.oct03,'09:25','9:25 AM','fem_depflores','fem_guerreras'),
M('m30','cat_11_14',D.oct03,'10:20','10:20 AM','c1114_guerreritos','c1114_alcones'),
M('m31','cat_fem',D.oct03,'15:00','3:00 PM','fem_depflores','fem_sierrita'),

/* DOMINGO 4 OCT */
M('m32','cat_fem',D.oct04,'15:00','3:00 PM','fem_dibulla','fem_depflores'),
M('m33','cat_fem',D.oct04,'15:55','3:55 PM','fem_dibulla','fem_sierrita'),
M('m34','cat_fem',D.oct04,'16:50','4:50 PM','fem_guerreras','fem_sueno'),

/* SÁBADO 11 OCT */
M('m35','cat_15_17',D.oct11,'15:00','3:00 PM','c1517_depflores','c1517_guerreros'),
M('m36','cat_fem',D.oct11,'15:55','3:55 PM','fem_dibulla','fem_alfas'),
M('m37','cat_fem',D.oct11,'16:50','4:50 PM','fem_alfas','fem_sierrita')
];

/* ============================================================
   ESTADO PÚBLICO (solo lectura)
============================================================ */
const shared={
  tournament:{name:'Campeonato Santa Rita 2026',season:'2026'},
  results:{},
  scorers:{},
  category:'cat_11_14'
};

/* ============================================================
   DECODIFICAR HASH
============================================================ */
function decodeShareData(str){
  try{
    str=str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length%4) str+='=';
    const bin=atob(str);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){console.warn(e);return null;}
}
function loadSharedData(){
  const m=(location.hash||'').match(/[#&]d=([^&]+)/);
  if(!m)return false;
  const data=decodeShareData(m[1]);
  if(!data)return false;
  if(data.t)shared.tournament.name=data.t;
  if(data.s)shared.tournament.season=data.s;
  if(data.r)shared.results=data.r;
  if(data.g)shared.scorers=data.g;
  return true;
}

/* ============================================================
   HELPERS
============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getTeam=id=>{
  for(const cid in TEAMS){
    const t=TEAMS[cid].find(x=>x.id===id);
    if(t) return t;
  }
  return {id,name:'?',color:'#666'};
};
function teamBadge(team,size=34,square=false){
  const initials=(team.name||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const content=team.emoji?team.emoji:initials;
  return `<div class="badge${square?' badge-square':''}" style="--c:${team.color||'#888'};width:${size}px;height:${size}px;font-size:${size*0.42}px">${content}</div>`;
}
const shortName=t=>t.name;

/* ============================================================
   CÁLCULOS
============================================================ */
function computeStandings(catId){
  const teams=TEAMS[catId]||[];
  const matches=MATCHES.filter(m=>m.categoryId===catId);
  const s={};
  teams.forEach(t=>s[t.id]={teamId:t.id,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,dg:0,pts:0});
  for(const m of matches){
    const r=shared.results[m.id];if(!r)continue;
    const H=s[m.homeId],A=s[m.awayId];if(!H||!A)continue;
    const[hg,ag]=r;
    H.pj++;A.pj++;H.gf+=hg;H.gc+=ag;A.gf+=ag;A.gc+=hg;
    if(hg>ag){H.pg++;H.pts+=3;A.pp++;}
    else if(hg<ag){A.pg++;A.pts+=3;H.pp++;}
    else{H.pe++;A.pe++;H.pts++;A.pts++;}
  }
  const arr=Object.values(s);
  arr.forEach(x=>x.dg=x.gf-x.gc);
  arr.sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||0);
  return arr;
}
function playedMatches(catId){
  return MATCHES.filter(m=>m.categoryId===catId&&shared.results[m.id])
    .sort((a,b)=>b.dateKey.localeCompare(a.dateKey)||b.time.localeCompare(a.time));
}
function upcomingMatches(catId){
  return MATCHES.filter(m=>m.categoryId===catId&&!shared.results[m.id])
    .sort((a,b)=>a.dateKey.localeCompare(b.dateKey)||a.time.localeCompare(b.time));
}

/* ============================================================
   RENDER
============================================================ */
function render(){
  document.title=shared.tournament.name;
  $('#t-name').textContent=shared.tournament.name;
  $('#t-sub').textContent='Temporada '+shared.tournament.season;

  $('#cats').innerHTML=CATEGORIES.map(c=>`
    <button class="cat-tab ${c.id===shared.category?'active':''}" data-cat="${c.id}">
      ${esc(c.pill)}
    </button>`).join('');

  const catId=shared.category;
  const table=computeStandings(catId);
  const played=playedMatches(catId);
  const upcoming=upcomingMatches(catId);
  const isFem=catId==='cat_fem';
  const qualifies=isFem?4:3;

  let html='';

  /* TABLA */
  html+=`<div class="section-title">Tabla de posiciones</div>`;
  html+=`<div class="standings-scroll"><div class="standings-table">
    <div class="s-row s-head">
      <div class="s-pos">#</div>
      <div class="s-team">Equipo</div>
      <div class="s-num">PJ</div><div class="s-num">PG</div><div class="s-num">PE</div>
      <div class="s-num">PP</div><div class="s-num">GF</div><div class="s-num">GC</div>
      <div class="s-num">DG</div><div class="s-num s-pts">PTS</div>
    </div>`;
  table.forEach((s,i)=>{
    const team=getTeam(s.teamId);
    const pos=i+1;
    const qualified=pos<=qualifies;
    const eliminated=pos>qualifies;
    const medal=pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':null;
    const cls=['s-row',qualified?'is-qualified':'',eliminated?'is-eliminated':'',medal?'has-medal':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}">
      <div class="s-pos">${medal||pos}</div>
      <div class="s-team">${teamBadge(team,22)}<span class="s-team-name">${esc(shortName(team))}</span></div>
      <div class="s-num">${s.pj}</div><div class="s-num">${s.pg}</div><div class="s-num">${s.pe}</div>
      <div class="s-num">${s.pp}</div><div class="s-num">${s.gf}</div><div class="s-num">${s.gc}</div>
      <div class="s-num">${s.dg>0?'+'+s.dg:s.dg}</div>
      <div class="s-num s-pts">${s.pts}</div>
    </div>`;
  });
  html+=`</div></div>`;

  /* ÚLTIMOS RESULTADOS */
  if(played.length){
    html+=`<div class="section-title">Últimos resultados</div>`;
    html+=played.slice(0,8).map(m=>renderMatch(m)).join('');
  }

  /* PRÓXIMOS */
  if(upcoming.length){
    html+=`<div class="section-title">Próximos partidos</div>`;
    html+=upcoming.slice(0,8).map(m=>renderMatch(m)).join('');
  }

  if(!played.length&&!upcoming.length){
    html+=`<div class="empty">Sin datos todavía.</div>`;
  }

  html+=`<div class="footer">Vista oficial · <b>${esc(shared.tournament.name)}</b></div>`;

  $('#content').innerHTML=html;
}

function renderMatch(m){
  const home=getTeam(m.homeId);
  const away=getTeam(m.awayId);
  const r=shared.results[m.id];
  const done=!!r;
  const sc=shared.scorers[m.id];

  const scoreHtml=done
    ? `<div class="score">
         <span class="num ${r[0]>r[1]?'winner':''}">${r[0]}</span>
         <span class="dash">—</span>
         <span class="num ${r[1]>r[0]?'winner':''}">${r[1]}</span>
       </div>`
    : `<div class="vs-pill">VS</div>`;

  const scorersLine=done&&sc&&(sc.home||sc.away)
    ? `<div class="scorers-line">⚽ ${sc.home?`<b>${esc(shortName(home))}:</b> ${esc(sc.home)} `:''}${sc.away?`<b>${esc(shortName(away))}:</b> ${esc(sc.away)}`:''}</div>`
    : '';

  return `<div class="match ${done?'is-done':''}">
    <div class="match-head">
      <span class="match-time">${esc(m.timeLabel)}</span>
      <span class="match-date">${esc(m.dayLabel)}</span>
    </div>
    <div class="match-body">
      <div class="side">${teamBadge(home,26)}<span class="side-name">${esc(shortName(home))}</span></div>
      ${scoreHtml}
      <div class="side right">${teamBadge(away,26)}<span class="side-name">${esc(shortName(away))}</span></div>
    </div>
    ${scorersLine}
  </div>`;
}

/* ============================================================
   EVENTOS
============================================================ */
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-cat]');
  if(!btn)return;
  shared.category=btn.dataset.cat;
  render();
});

/* ============================================================
   INIT
============================================================ */
loadSharedData();
render();
})();
</script>
</body>
</html>
